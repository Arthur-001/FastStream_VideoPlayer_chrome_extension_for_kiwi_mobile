<!DOCTYPE html>
<html lang="en">

<head>
    <title>FastStream</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="../icon128.png" />
    <link rel="stylesheet" href="./assets/fluidplayer/css/colors.css">
    <link rel="stylesheet" href="./assets/fluidplayer/css/fluidplayer.css">
    <link rel="stylesheet" href="./assets/sweetalert/css/sweetalert.css">
    <link rel="stylesheet" href="./assets/coloris/css/coloris.css">
    <style>
        /* === Kiwi Mobile: Seek Overlay Styles === */
        .kiwi-seek-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            overflow: hidden;
            z-index: 100;
        }
        .kiwi-seek-overlay.kiwi-active {
            opacity: 1;
        }
        .kiwi-seek-left {
            left: 0;
            border-radius: 0 50% 50% 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(0,0,0,0.35) 0%, transparent 75%);
        }
        .kiwi-seek-right {
            right: 0;
            border-radius: 50% 0 0 50%;
            background: radial-gradient(ellipse at 80% 50%, rgba(0,0,0,0.35) 0%, transparent 75%);
        }
        .kiwi-seek-ripple {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.6);
            animation: none;
            opacity: 0;
        }
        .kiwi-seek-ripple-2 {
            animation-delay: 0.12s;
        }
        .kiwi-seek-overlay.kiwi-active .kiwi-seek-ripple {
            animation: kiwi-ripple-anim 0.5s ease-out forwards;
        }
        .kiwi-seek-overlay.kiwi-active .kiwi-seek-ripple-2 {
            animation: kiwi-ripple-anim 0.5s 0.12s ease-out forwards;
        }
        @keyframes kiwi-ripple-anim {
            0%   { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .kiwi-seek-arrows {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.7);
        }
        .kiwi-seek-text {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }

        /* === Kiwi Mobile: Flow Drag Seek Overlay === */
        .kiwi-drag-seek {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 18px 36px 16px;
            background: rgba(0, 0, 0, 0.78);
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.18s ease;
            z-index: 200;
            min-width: 180px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 4px 32px rgba(0,0,0,0.5);
        }
        .kiwi-drag-seek.kiwi-drag-active {
            opacity: 1;
        }
        /* Arrow direction indicator line */
        .kiwi-drag-seek-direction {
            font-size: 18px;
            color: rgba(255,255,255,0.55);
            line-height: 1;
            letter-spacing: 4px;
            margin-bottom: 2px;
        }
        /* Large current position time */
        .kiwi-drag-seek-time {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
            letter-spacing: 0.5px;
            line-height: 1;
        }
        /* Delta: how much time shifted */
        .kiwi-drag-seek-delta {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1;
            padding: 3px 10px;
            border-radius: 999px;
            transition: color 0.1s ease, background 0.1s ease;
        }
        .kiwi-drag-seek-delta.forward  { color: #4ade80; background: rgba(74,222,128,0.15); }
        .kiwi-drag-seek-delta.backward { color: #f87171; background: rgba(248,113,113,0.15); }
        .kiwi-drag-seek-delta.neutral  { color: rgba(255,255,255,0.6); background: transparent; }

        /* === Kiwi Mobile: Progress Bar Drag-Scrubbing State === */
        /* When kiwi-drag-scrubbing is on the progress container, swell bar to 5px */
        .fluid_video_wrapper.fluid_player_layout_default .fluid_controls_container
            .fluid_controls_progress_container.kiwi-drag-scrubbing .fluid_controls_progress,
        .fluid_video_wrapper.fluid_player_layout_default .fluid_controls_container
            .fluid_controls_progress_container.kiwi-drag-scrubbing .fluid_controls_buffered {
            margin-top: -1px;
            height: 5px;
            transition: height 0.15s ease, margin-top 0.15s ease;
        }
        .fluid_video_wrapper.fluid_player_layout_default .fluid_controls_container
            .fluid_controls_progress_container.kiwi-drag-scrubbing .fluid_controls_progress
            .fluid_controls_currentprogress {
            height: 5px;
            transition: height 0.15s ease, width var(--kiwi-drag-transition, 150ms) ease-out;
        }
        /* Normal state also gets width transition during drag (driven by JS CSS var) */
        .fluid_controls_progress_container.kiwi-drag-scrubbing .fluid_controls_currentprogress {
            transition: width var(--kiwi-drag-transition, 150ms) ease-out !important;
        }


        /* === Kiwi Mobile: Play/Pause Circle Animation === */
        .fluid_control_playpause_big_circle {
            transition: transform 0.3s ease, opacity 0.3s ease, background-color 0.2s ease;
            background-color: var(--popwindow-background-color) !important;
            border: var(--popwindow-border);
            opacity: 0.9;
        }
        .fluid_control_playpause_big_circle.transform-active {
            animation: kiwi-playpause-bounce 0.45s ease-out;
        }
        @keyframes kiwi-playpause-bounce {
            0% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
                background-color: rgba(255, 255, 255, 0.4);
            }
            100% {
                transform: scale(1);
                opacity: 0.9;
            }
        }

        /* Hide control bar bottom-left play/pause button */
        .fluid_control_playpause {
            display: none !important;
        }

        /* === Kiwi Mobile: Volume Block Expanded Styles === */
        .fluid_video_wrapper.fluid_player_layout_default .fluid_controls_container div:not(.reordering)>.volume_block.expanded .fluid_control_volume_container {
            width: var(--volume-block-width);
            visibility: visible;
        }
        .fluid_video_wrapper.fluid_player_layout_default .fluid_controls_container div:not(.reordering)>.volume_block.expanded .fluid_control_volume_container .fluid_control_volume .fluid_control_currentvolume .fluid_control_volume_currentpos {
            width: 11px;
            height: 11px;
        }

        /* === Kiwi Mobile: Touch Download Modal === */
        .kiwi-dl-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease-out;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .kiwi-dl-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .kiwi-dl-sheet {
            background: #18191c;
            color: #f3f4f6;
            width: 100%;
            max-width: 480px;
            border-radius: 20px 20px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            max-height: 88vh;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        @media (min-width: 601px) {
            .kiwi-dl-overlay {
                align-items: center;
            }
            .kiwi-dl-sheet {
                border-radius: 18px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                transform: scale(0.94);
                transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .kiwi-dl-overlay.active .kiwi-dl-sheet {
                transform: scale(1);
            }
        }
        .kiwi-dl-overlay.active .kiwi-dl-sheet {
            transform: translateY(0);
        }
        @media (min-width: 601px) {
            .kiwi-dl-overlay.active .kiwi-dl-sheet {
                transform: scale(1);
            }
        }
        .kiwi-dl-handle-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 10px;
            padding-bottom: 4px;
        }
        .kiwi-dl-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }
        .kiwi-dl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .kiwi-dl-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
        }
        .kiwi-dl-title-icon {
            width: 22px;
            height: 22px;
            color: #3b82f6;
        }
        .kiwi-dl-close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
            transition: all 0.15s ease;
        }
        .kiwi-dl-close-btn:active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: scale(0.92);
        }
        .kiwi-dl-body {
            padding: 16px 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .kiwi-dl-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kiwi-dl-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .kiwi-dl-input-wrap {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 4px 12px;
            transition: border-color 0.2s ease;
        }
        .kiwi-dl-input-wrap:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }
        .kiwi-dl-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            padding: 10px 0;
            outline: none;
            min-height: 24px;
        }
        .kiwi-dl-ext-badge {
            background: rgba(59, 130, 246, 0.18);
            color: #60a5fa;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            user-select: none;
        }
        .kiwi-dl-format-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 4px;
            gap: 6px;
        }
        .kiwi-dl-tab {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            min-height: 48px;
            transition: all 0.2s ease;
        }
        .kiwi-dl-tab svg {
            width: 18px;
            height: 18px;
        }
        .kiwi-dl-tab.active {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }
        .kiwi-dl-tab:active {
            transform: scale(0.97);
        }
        .kiwi-dl-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .kiwi-dl-section.hidden {
            display: none;
        }
        .kiwi-dl-options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .kiwi-dl-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #e5e7eb;
            cursor: pointer;
            min-height: 52px;
            text-align: left;
            transition: all 0.15s ease;
        }
        .kiwi-dl-chip:active {
            transform: scale(0.98);
        }
        .kiwi-dl-chip.selected {
            background: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
        }
        .kiwi-dl-chip-main {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .kiwi-dl-chip-label {
            font-size: 0.95rem;
            font-weight: 600;
        }
        .kiwi-dl-chip.selected .kiwi-dl-chip-label {
            color: #fff;
        }
        .kiwi-dl-chip-sub {
            font-size: 0.8rem;
            color: #9ca3af;
            font-weight: 500;
        }
        .kiwi-dl-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .badge-direct {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-transcode {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .badge-mp3 {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .kiwi-dl-footer {
            padding: 12px 18px 20px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .kiwi-dl-btn-cancel {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #d1d5db;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            min-height: 48px;
            transition: all 0.15s ease;
        }
        .kiwi-dl-btn-cancel:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.97);
        }
        .kiwi-dl-btn-start {
            flex: 2;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
            transition: all 0.15s ease;
        }
        .kiwi-dl-btn-start svg {
            width: 20px;
            height: 20px;
        }
        .kiwi-dl-btn-start:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
        }

        /* === Kiwi Mobile: Active Task Sheet & Progress === */
        .kiwi-dl-chip-sub {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
        }
        .kiwi-dl-chip-size {
            background: rgba(255, 255, 255, 0.08);
            color: #93c5fd;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }
        .kiwi-dl-chip.selected .kiwi-dl-chip-size {
            background: rgba(59, 130, 246, 0.3);
            color: #bfdbfe;
        }

        .kiwi-dl-active-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .kiwi-dl-task-meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .kiwi-dl-task-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }
        .kiwi-dl-task-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .kiwi-dl-task-file {
            font-size: 0.82rem;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .kiwi-dl-status-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .kiwi-dl-status-badge.status-running {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }
        .kiwi-dl-status-badge.status-running::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #60a5fa;
            border-radius: 50%;
            animation: kiwi-pulse 1.4s infinite;
        }
        .kiwi-dl-status-badge.status-paused {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }
        .kiwi-dl-status-badge.status-paused::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #fbbf24;
            border-radius: 50%;
        }
        @keyframes kiwi-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        .kiwi-dl-progress-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .kiwi-dl-progress-track {
            height: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .kiwi-dl-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
            background-size: 200% 100%;
            border-radius: 6px;
            transition: width 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            animation: kiwi-progress-shine 2s linear infinite;
        }
        .kiwi-dl-progress-fill.paused {
            background: linear-gradient(90deg, #d97706, #fbbf24);
            animation: none;
        }
        @keyframes kiwi-progress-shine {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
        .kiwi-dl-progress-labels {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .kiwi-dl-progress-phase {
            color: #d1d5db;
            font-weight: 500;
        }
        .kiwi-dl-progress-pct {
            font-weight: 700;
            color: #60a5fa;
            font-variant-numeric: tabular-nums;
        }

        .kiwi-dl-metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .kiwi-dl-metric-card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .kiwi-dl-metric-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ca3af;
            font-weight: 600;
        }
        .kiwi-dl-metric-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-variant-numeric: tabular-nums;
        }

        .kiwi-dl-active-actions {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .kiwi-dl-btn-action {
            flex: 1;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            transition: all 0.15s ease;
        }
        .kiwi-dl-btn-action svg {
            width: 18px;
            height: 18px;
        }
        .kiwi-dl-btn-action:active {
            transform: scale(0.97);
        }
        .kiwi-dl-btn-pause {
            background: rgba(245, 158, 11, 0.18);
            border: 1.5px solid rgba(245, 158, 11, 0.4);
            color: #fbbf24;
        }
        .kiwi-dl-btn-pause:active {
            background: rgba(245, 158, 11, 0.3);
        }
        .kiwi-dl-btn-resume {
            background: rgba(16, 185, 129, 0.18);
            border: 1.5px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
        .kiwi-dl-btn-resume:active {
            background: rgba(16, 185, 129, 0.3);
        }
        .kiwi-dl-btn-stop {
            background: rgba(239, 68, 68, 0.18);

        .kiwi-dl-btn-stop:active {

        }
        .kiwi-dl-bg-hint {

            font-size: 0.76rem;
            color: #6b7280;
            padding-top: 4px;

    <script src="./preload.mjs" type="module" charset="UTF-8"></script>

    <div class="mainplayer fluid_video_wrapper fluid_player_layout_default controls_visible" role="application"
        tabindex="-1">
        <div class="video-container">

                    </div>
                    <div class="status_message"></div>
                    <div class="status_message"></div>
                    <div class="status_message"></div>

                </div>
                <div class="fluid_controls_right">

                </div>
                <div class="fluid_controls_extra_tools">
                    <div data-i18n-label="player_play_label" class="fluid_button fluid_control_playpause" role="button">

                        <svg class="pause">

                    <div class="volume_block" role="slider">

                                <use href="assets/fluidplayer/static/icons.svg#speaker"></use>
                            </svg>
                            <svg class="speaker-muted" style="color: rgb(255,100,100)">
                                <use href="assets/fluidplayer/static/icons.svg#speaker-muted"></use>
                            </svg>
                            <div class="volume_banner" style="display: none;">
                            </div>
                        </div>
                        <div class="fluid_control_volume_container fluid_slider tooltip">

                                <div class="fluid_control_currentvolume" style="width: 100%">

                    </div>
                    <div role="button" data-i18n-label="player_sourcesbrowser_open_label"
